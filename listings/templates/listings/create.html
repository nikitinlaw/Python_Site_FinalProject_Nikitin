<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Разместить объявление</title>
</head>

<body>
    <h1>Разместить объявление</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Отправить на модерацию
        </button>
    </form>

    <p>
        <a href="/">Вернуться к объявлениям</a>
    </p>
</body>
</html>
